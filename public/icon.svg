<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="circA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="circB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <clipPath id="clipA">
      <circle cx="210" cy="256" r="140" />
    </clipPath>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Circle A (Green) -->
  <circle cx="210" cy="256" r="140" fill="url(#circA)" opacity="0.85" />

  <!-- Circle B (Amber) -->
  <circle cx="302" cy="256" r="140" fill="url(#circB)" opacity="0.85" />

  <!-- Intersection (Green Gold Overlap) -->
  <g clip-path="url(#clipA)">
    <circle cx="302" cy="256" r="140" fill="#10b981" opacity="0.95" />
  </g>

  <!-- Central % Symbol Accent -->
  <text x="256" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-1">PO</text>
</svg>
